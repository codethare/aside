name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev pkg-config \
            bubblewrap curl \
            fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-cjk
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        env:
          # The sandbox's DNS/TLS check needs a network; the runner has one.
          ASIDE_NET: "1"
        run: cargo test
