[package]
name = "aside"
version = "0.1.0"
edition = "2024"
description = "A keyboard-summoned AI chat panel for Wayland that leaves nothing on disk"
license = "AGPL-3.0-only"

[dependencies]
ab_glyph_rasterizer = "0.1.10"
fontdb = "0.24.0"
# Parses answers' markdown. Pinned exactly: 0.13.5 is the release that fixed a
# panic in `into_offset_iter()` reachable from a 13-byte document, and no RustSec
# advisory exists for this crate to warn us about the next one.
pulldown-cmark = { version = "= 0.13.5", default-features = false }
skrifa = "0.48.0"
smithay-client-toolkit = "0.21.1"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["unstable"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
