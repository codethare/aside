[package]
name = "aside"
version = "0.1.0"
edition = "2024"
description = "A keyboard-summoned AI chat panel for Wayland that leaves nothing on disk"
license = "AGPL-3.0-only"

[dependencies]
ab_glyph_rasterizer = "0.1.10"
fontdb = "0.24.0"
# Parses answers' markdown. Pinned exactly, and the pin is the control: 0.13.6 is
# the release that closed RUSTSEC-2026-0433 (quadratic parsing of nested image
# wikilinks, which this crate never enables, but an audit a reader can trust has to
# be clean), and 0.13.5 before it fixed a panic reachable from a 13-byte document.
pulldown-cmark = { version = "= 0.13.6", default-features = false }
skrifa = "0.48.0"
smithay-client-toolkit = "0.21.1"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["unstable"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
